name: "nllb-multi-domain"

data:
  path: "breakend/nllb-multi-domain"
  source_lang: eng_Latn
  target_lang: ayr_Latn
  dataset_config_name: "eng_Latn-ayr_Latn"

model:
  name: "facebook/nllb-200-distilled-1.3B"
  # name: "facebook/nllb-200-distilled-600M"
  # name: "facebook/nllb-200-3.3B"
  use_lora: false
  lora:
    r: 8
    alpha: 32
    dropout: 0.05
    target_modules:
      - q_proj
      - v_proj

training:
  lr: 0.000002
  force_ground_truth:
    enabled: true
    patience: 3
    min_improvement: 1e-4
  accumulate_grad_batches: 1
  epochs: 5
  batch_size: 4
  num_return_sequences: 6
  updates_per_batch: 50
  gen_temperature: 2.0
  beta: 0.04
  clip_param: 0.2
  max_grad_norm: 10.0
  top_k: 100
  top_p: 0.95
  
eval:
  run: true
  only: false
  translation_metric: ["chrf++"]
  every_n_batches: 50

logging:
  use_wandb: true
  wandb_project: "grpo-translation-nllb-multi-domain"
  wandb_name: "50-gradient-steps-1.3B-process-reward-batch-6"
  wandb_dir: "/root/wandb"
  log_every_n_steps: 10

reward:
  # MT reward settings (BLEU and chrF++)
  bleu_weight: 0.5  # Weight for BLEU score
  chrf_weight: 0.5  # Weight for chrF++ score


constraints:
  min_sentence_len: 1
  max_sentence_len: 64
